---
layout: default
---
<article class="post-single">
  <h1>{{ page.title }}</h1>
  <p class="post-meta"><small>Dipublikasikan pada: {{ page.date | date: "%d %B %Y" }}</small></p>
  
  {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title }}" class="featured-image">
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
</article>
