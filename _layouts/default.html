<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#1e3a8a">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Main CSS (pakai relative_url agar benar di subfolder) -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">

  {% feed_meta %}
  {% seo %}

  <!-- Dark Mode Bootstrapping: cegah flicker -->
  <script>
  (function () {
    try {
      var stored = localStorage.getItem('blogjak-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);

      // Set warna ikon sesegera mungkin untuk cegah flicker
      function applyIconColor() {
        var color = theme === 'dark' ? '#FFA500' : '#1e3a8a';
        var iconClass = theme === 'dark' ? 'fa-sun' : 'fa-moon';
        document.querySelectorAll('.theme-icon').forEach(function (icon) {
          icon.className = 'theme-icon fa-solid ' + iconClass;
          icon.style.color = color;
          icon.style.webkitTextFillColor = color;
        });
        document.querySelectorAll('.theme-toggle, .theme-switch-btn').forEach(function (btn) {
          btn.style.color = color;
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyIconColor);
      } else {
        applyIconColor();
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
  {% include header.html %}

  <main class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Main JS -->
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
