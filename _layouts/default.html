<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">

  <!-- Feed & SEO -->
  {% feed_meta %}
  {% seo %}

  <!-- Dark Mode Bootstrapping (sebelum render supaya tidak flicker) -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('blogjak-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  {% include header.html %}

  <main class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Dark Mode Toggle Script -->
  <script>
    (function () {
      const root = document.documentElement;
      const toggles = document.querySelectorAll('[data-theme-toggle]');
      const icons = document.querySelectorAll('.theme-icon');

      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        try { localStorage.setItem('blogjak-theme', theme); } catch (e) {}
        icons.forEach(function (icon) {
          icon.className = 'theme-icon fa-solid ' + (theme === 'dark' ? 'fa-sun' : 'fa-moon');
        });
      }

      // Init icon sesuai theme saat ini
      const current = root.getAttribute('data-theme') || 'light';
      icons.forEach(function (icon) {
        icon.className = 'theme-icon fa-solid ' + (current === 'dark' ? 'fa-sun' : 'fa-moon');
      });

      toggles.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          applyTheme(next);
        });
      });

      // Follow system changes jika user belum override
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem('blogjak-theme')) {
          applyTheme(e.matches ? 'dark' : 'light');
        }
      });

      // Hamburger Menu
      const hamburger = document.querySelector('.hamburger');
      const navMenu = document.querySelector('.nav-menu');
      if (hamburger && navMenu) {
        hamburger.addEventListener('click', function () {
          hamburger.classList.toggle('active');
          navMenu.classList.toggle('active');
        });
        navMenu.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('click', function () {
            hamburger.classList.remove('active');
            navMenu.classList.remove('active');
          });
        });
      }
    })();
  </script>
</body>
</html>
