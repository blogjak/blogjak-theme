# ============================================
# Blogjak Theme Versi 2 - Konfigurasi Jekyll
# ============================================

title: "Blogjak Theme"
tagline: "Versi 2 - Pure Markdown Blogging"
description: "Tema Jekyll native dengan dark mode, gallery grid, dan pagination dinamis."
author: "Blogjak"
email: "hello@blogjak.dev"

# ====== PENTING: URL & BASEURL ======
# Untuk GitHub Pages di repo "blogjak-theme":
#   url: "https://username.github.io"
#   baseurl: "/blogjak-theme"
#
# Untuk user site (username.github.io):
#   url: "https://username.github.io"
#   baseurl: ""
#
# Untuk custom domain / root:
#   url: "https://domain.com"
#   baseurl: ""
url: "https://username.github.io"
baseurl: "/blogjak-theme"

# ---------- Build Settings ----------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/
timezone: Asia/Jakarta

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# ---------- Pagination ----------
paginate: 6
paginate_path: "/page/:num/"

# ---------- Plugins ----------
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap

# ---------- Defaults ----------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
  - scope:
      path: ""
    values:
      layout: "default"

# ---------- Social Media ----------
social:
  github: "https://github.com/blogjak"
  twitter: "https://twitter.com/blogjak"
  facebook: "https://facebook.com/blogjak"
  instagram: "https://instagram.com/blogjak"
  youtube: "https://youtube.com/@blogjak"
  linkedin: "https://linkedin.com/in/blogjak"

# ---------- Exclude ----------
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
