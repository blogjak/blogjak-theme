# ============================================
# Blogjak Theme Versi 3.0 — Konfigurasi Jekyll
# ============================================

title: "Sokaraja Laundry"
tagline: "Rajanya Laundry Di Purwokerto dan Banyumas"
description: "Kami menerima jasa laundry kiloan dan satuan, menjual peralatan dan perlengkapan laundry diantaranya sabun dan parfum"
author: "Wahyudi"
email: "sokarajalaundry@gmail.com"
version: "3.0.0"

# ====== URL & BASEURL ======
# Sesuaikan dengan deployment Anda:
# - GitHub Pages repo: baseurl: "/blogjak-theme"
# - Root domain:       baseurl: ""
# - Subfolder:         baseurl: "/nama-folder"
url: "https://sokarajalaundry.github.io"
baseurl: ""

# ====== Build Settings ======
markdown: kramdown
highlighter: rouge
# PERUBAHAN v3.0: permalink tanpa tanggal & tag
permalink: /:categories/:title/
timezone: Asia/Jakarta

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# ====== Pagination ======
paginate: 6
paginate_path: "/page/:num/"

# ====== Plugins ======
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# ====== Language & SEO ======
lang: id_ID
logo: "https://scontent-cgk1-1.xx.fbcdn.net/v/t39.30808-6/470205868_569155715736487_8553985799230445898_n.jpg?stp=dst-jpg_tt6&cstp=mx500x500&ctp=s500x500&_nc_cat=109&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeE3QllIHl2n7ogcs1y9_qDrmx4sDctYPYebHiwNy1g9h68rXT0Pag2hHqOktMZxt_WUh53r_fPt5vZaq37g7gzU&_nc_ohc=mu7fAgjY86oQ7kNvwGZnRI1&_nc_oc=Adp-ObjLODC-K6JeZQp5JLa6lfbMPDKK1lWard0BQ6bcTOMA_QOU2uM5JT80KiBDeyc&_nc_zt=23&_nc_ht=scontent-cgk1-1.xx&_nc_gid=4_1cc4CwmADHi3Nyeu7KtQ&_nc_ss=7f2a8&oh=00_AQKq7tqmuG1_vq1XlCUY_17O8oQxMGHgD-TUi-CyMqhRvA&oe=6AB82824"

twitter:
  username: blogjak
  card: summary_large_image

social:
  name: Blogjak Theme
  links:
    - https://github.com/blogjak
    - https://twitter.com/blogjak

# ====== Search Engine Verification ======
google_site_verification: ""
bing_site_verification: ""
yandex_site_verification: ""

# ====== Search ======
search:
  enabled: true
  placeholder: "Cari artikel..."
  max_results: 10

# ====== Related Posts ======
related:
  enabled: true
  count: 3

# ====== Defaults ======
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      sitemap: true
  - scope:
      path: ""
    values:
      layout: "default"

# ====== Social Links (footer) ======
# PERUBAHAN v3.0: pindah dari `social:` ke `social_links:`
# Kosongkan ("") untuk menyembunyikan ikon
social_links:
  github: "https://github.com/blogjak"
  twitter: "https://twitter.com/blogjak"
  facebook: "https://facebook.com/blogjak"
  instagram: "https://instagram.com/blogjak"
  youtube: "https://youtube.com/@blogjak"
  linkedin: "https://linkedin.com/in/blogjak"
  tiktok: ""
  telegram: ""
  whatsapp: ""
  pinterest: ""
  reddit: ""
  discord: ""
  medium: ""
  devto: ""

# ====== Exclude ======
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
